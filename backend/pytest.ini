; 골든 테스트 전용 pytest 설정 (ADR-SC-0002).
;
; ★★ **테스트 러너는 여전히 `manage.py test` 가 정본이다.**
;    pytest 는 `*_test.py` 만 줍는다 — `tests.py` 311건은 건드리지 않는다.
;    한 벌을 두 러너가 동시에 돌면 실패가 두 번 보고돼 어느 쪽이 진짜인지 흐려진다.
;
;      python manage.py test          ← 전체 (Django TestCase · DB 사용)
;      .venv/bin/pytest               ← 골든 테스트만 (순수 함수 · DB 미사용)
;
; ★ `golden_test.py` 라는 이름은 우연이 아니다. Django 의 discovery 패턴은
;   `test*.py` 라 이 파일을 **줍지 않고**, pytest 의 `*_test.py` 는 줍는다.
;   이름을 `test_golden.py` 로 바꾸면 양쪽이 다 주워 `snapshot` 픽스처가 없다며 깨진다.

[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = *_test.py
testpaths = trading
addopts = -q

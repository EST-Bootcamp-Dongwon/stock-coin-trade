# ─────────────────────────────────────────────────────────────────
# v3.0 루트 pytest — **순수 함수 테스트 전용이다. DB 를 쓰지 않는다.**
#
# 🔒 `DJANGO_SETTINGS_MODULE` 을 여기에 넣지 않는다 (→ `AGENTS.md` 5장).
#    동결된 v2.0 은 러너가 따로다 — `cd backend && .venv/bin/pytest`.
#    여기에 Django 설정을 끌어오면 두 러너가 한 설정을 공유하게 되고, v3.0 을
#    건드릴 때마다 동결 회귀 23건이 함께 흔들린다.
#
# ★ 두 러너가 섞이지 않는 **실제 장치**는 `backend/pytest.ini` 다 (2026-09-11 확인).
#   pytest 는 인자 위치에서 위로 올라가며 설정 파일을 찾고 처음 만난 것을 쓴다.
#   `cd backend && .venv/bin/pytest` 는 거기서 `backend/pytest.ini` 를 먼저 만나
#   `rootdir=backend · testpaths=trading` 으로 고정된다 — 이 파일까지 올라오지 않는다.
#   🔒 **`backend/pytest.ini` 를 지우지 마라.** 지우면 동결 회귀가 이 파일을 주워
#      `testpaths=sector` 를 물고 0건 수집으로 "통과"한다 — 가장 나쁜 실패다.
#
# 🔒 `python_files` 를 `*_test.py` 로 **좁힌다.** 기본값은 `test_*.py` 까지
#    포함하는데, Django 의 테스트 탐색기는 `test*.py` 를 줍고 pytest 의 기본값은
#    양쪽을 다 줍는다. 접미사 하나로 고정해 두면 `backend/` 와 `sector/` 가
#    서로의 테스트를 주워 `snapshot` 픽스처가 없다며 깨지는 일이 구조적으로 없다.
# ─────────────────────────────────────────────────────────────────
[pytest]
# ★ `batch` 를 함께 수집한다 (M5) — 배치 CLI 도 로직이고, 검증되지 않으면
#   "수집이 멱등한가" 같은 성질이 사람의 기억에만 남는다. Django 와의 분리는
#   `backend/pytest.ini` 가 지키므로 여기에 경로를 늘려도 동결 회귀는 흔들리지 않는다.
#   ★ `dashboard` 도 함께 수집한다 (M8). 🔴 빠뜨렸다가 24건이 조용히 안 돌았다 —
#     위 머리주석이 경고한 "0건 수집으로 통과" 와 같은 종류의 사고다. 화면 계층에는
#     `AppTest` 로만 잡히는 버그가 실재한다(네 페이지의 URL 경로 충돌).
testpaths = sector batch dashboard
python_files = *_test.py
addopts = -q

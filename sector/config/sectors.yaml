    note: |
      완성차 2사 비중이 커서 TOP3 압축 ETF 와 KRX 자동차 전체 ETF 를 함께 둔다 —
      갈라지면 "완성차만 오르는가 / 부품사까지 오르는가"의 답이다.
      환율(원/달러)에 민감해 매크로가 섹터 점수를 끌고 가는 경우가 있다.
      환율은 축에 넣지 않는다(ECOS 는 배경 맥락일 뿐이다).


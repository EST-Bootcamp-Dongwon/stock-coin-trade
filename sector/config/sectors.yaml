# ─────────────────────────────────────────────────────────────────
# 섹터 마스터 — **사람이 손으로 적는다.** 이 파일이 "어느 섹터인가"의 정본이다.
#
# ★ 왜 손으로 적는가 (확정 사실 V5)
#   KRX Open API 에 **지수 구성종목·ETF PDF 가 없다.** 자동으로 채울 원천이
#   존재하지 않는다. 그래서 묶음의 근거를 사람이 쓰고, **코드가 검증한다** —
#   `python -m batch.validate_config` 가 아래 전부를 원천과 맞춰 본다.
#
# 🔒 모든 섹터에 `note` 를 1줄 이상 쓴다. 근거 없는 묶음을 막는 게이트다.
#    "왜 이 ETF 인가 · 왜 이 종목인가 · 무엇이 애매한가"를 적는다.
#
# ★ 코드·이름은 **원천에서 그대로 베낀다.** 기억으로 적지 않는다.
#   2026-09-11 에 실제로 6건이 어긋났다 — `한글과컴퓨터`→`한컴` ·
#   `엔씨소프트`→`NC` · `LIG넥스원`→`LIG디펜스앤에어로스페이스` ·
#   `HDC현대산업개발`→`IPARK현대산업개발` · `더존비즈온`(유니버스에 없음) ·
#   `HD현대미포`(유니버스에 없음). 검증이 없었다면 그대로 굳었다.
#
# ★ 계획서(B-3)와 다른 점 둘 — 이유를 적어 둔다
#   ① `ticker` 를 `code` 로 통일했다. ETF 와 종목이 같은 6자리 체계를 쓰고
#      검증 규칙도 같다. 어휘를 둘로 두면 검증 코드가 갈라진다.
#   ② `aum_eok`(순자산 억원)을 넣지 않았다. 매일 바뀌는 값을 정적 설정에 박으면
#      금방 거짓이 되고, KRX 원천 수치를 Public 저장소에 적는 셈이다
#      (약관 제11조② → ADR-SC-0006). 규모·유동성은 검증기가 **그날 스냅샷에서
#      계산해 보여준다.**
#
# 🔒 여기에 KRX 원천 수치(종가·시총·거래대금·NAV)를 적지 않는다. 식별자와
#    사람의 판단만 적는다.
# ─────────────────────────────────────────────────────────────────

version: "2026-09-11"

# 화면 표시 의무 — KRX Open API 약관 제10조③ (확정 사실 V2)
source_notice: "한국거래소 통계정보"

# ── GICS 11 대분류 ───────────────────────────────────────────────────
# 상위 계층이다. 사용자의 멘탈 모델(섹터 로테이션의 국제 표준)이 여기 있고,
# 한국에서 실제로 유동성이 있는 것은 아래 `sectors`(테마 ETF)다. 둘을 잇는다.
#
# 🔒 11개를 **전부** 적는다. 비어 있는 대분류는 `empty_reason` 으로 왜 비었는지
#    말한다 — 화면이 "없음"을 그렇게 표시해야 팀원이 "빠뜨렸나?"를 묻지 않는다.
gics_sectors:
  - id: "Information Technology"
    name_ko: "정보기술"
  - id: "Communication Services"
    name_ko: "커뮤니케이션서비스"
  - id: "Industrials"
    name_ko: "산업재"
  - id: "Materials"
    name_ko: "소재"
  - id: "Consumer Discretionary"
    name_ko: "경기소비재"
  - id: "Consumer Staples"
    name_ko: "필수소비재"
  - id: "Health Care"
    name_ko: "헬스케어"
  - id: "Financials"
    name_ko: "금융"
  - id: "Utilities"
    name_ko: "유틸리티"
  - id: "Energy"
    name_ko: "에너지"
    empty_reason: |
      국내에 순수 정유·석유 ETF 가 없다. `KODEX 에너지화학` 계열이 정유와 화학을
      한 바구니에 담아 Materials 쪽 `chemical` 섹터로 들어가 있다 — 정유주
      (S-Oil·SK이노베이션)는 그 섹터의 구성종목 렌즈에 섞여 보인다.
      대분류로 따로 세우면 ETF 렌즈가 빈 채 순위에 끼어든다.
  - id: "Real Estate"
    empty_reason: |
      국내 리츠 ETF 는 배당·금리 상품에 가까워 "섹터 로테이션" 축과 성격이 다르다
      (모멘텀·폭이 금리에 종속된다). 이 대시보드의 4축이 설명하지 못하는 자산이라
      섹터로 세우지 않는다.
    name_ko: "부동산"

# ── 한국 테마 섹터 21개 ──────────────────────────────────────────────
# ★ 화면의 주인공이고 실제 매수 대상이다. 각 섹터를 두 렌즈로 본다 —
#   `etfs`(돈이 들어오는가 · 상장좌수·NAV) · `members`(몇 종목이 같이 오르나 · 폭).
#   🔒 두 렌즈가 갈라지면 갈라진 채로 보여준다. 평균 내지 않는다.
sectors:
  - id: semiconductor
    name_ko: 반도체
    gics: "Information Technology"
    etfs:
      - { code: "396500", name: "TIGER 반도체TOP10" }
      - { code: "091160", name: "KODEX 반도체" }
    members:
      - { code: "005930", name: "삼성전자" }
      - { code: "000660", name: "SK하이닉스" }
      - { code: "042700", name: "한미반도체" }
      - { code: "000990", name: "DB하이텍" }
      - { code: "403870", name: "HPSP" }
      - { code: "357780", name: "솔브레인" }
      - { code: "058470", name: "리노공업" }
      - { code: "240810", name: "원익IPS" }
    note: |
      국내 최대 테마이고 유동성이 압도적이다. ETF 둘의 성격이 달라 **둘 다 둔다** —
      `TIGER 반도체TOP10` 은 상위 10종목 압축(삼성전자·SK하이닉스 비중이 크다),
      `KODEX 반도체` 는 KRX 반도체 지수 전체(소부장까지 넓게). 같은 날 둘이
      갈라지면 그것이 "대형주만 오르는가 / 소부장까지 오르는가"의 답이다.
      구성종목은 대형주 2 + 장비·소재 6 으로 섞었다. 대형주만 담으면 폭 축이
      코스피 지수와 같아져 의미를 잃는다.

  - id: software
    name_ko: 소프트웨어
    gics: "Information Technology"
    etfs:
      - { code: "157490", name: "TIGER 소프트웨어" }
      - { code: "0105D0", name: "SOL 한국AI소프트웨어" }
    members:
      - { code: "035420", name: "NAVER" }
      - { code: "035720", name: "카카오" }
      - { code: "018260", name: "삼성에스디에스" }
      - { code: "286940", name: "롯데이노베이트" }
      - { code: "053800", name: "안랩" }
      - { code: "030520", name: "한컴" }
    note: |
      🔴 GICS 와 어긋나는 것을 적어 둔다 — NAVER·카카오는 GICS 상
      **Communication Services** 다. 그런데 팀이 실제로 보는 테마는 "소프트웨어·
      플랫폼"이고, 국내 소프트웨어 ETF 도 둘을 담는다. 그래서 여기에 두고
      이 줄로 밝힌다. 대분류 롤업에서 커뮤니케이션서비스가 과소평가된다.
      🔒 `TIGER 200 IT`(139260)를 쓰지 않았다 — 코스피200 정보기술은 삼성전자·
      SK하이닉스가 지배해 `semiconductor` 섹터와 사실상 같은 값이 된다.
      두 섹터가 같은 값을 내면 순위표가 거짓말을 한다.

  - id: game
    name_ko: 게임
    gics: "Communication Services"
    etfs:
      - { code: "300950", name: "KODEX 게임산업" }
      - { code: "364990", name: "TIGER 게임TOP10" }
    members:
      - { code: "036570", name: "NC" }
      - { code: "251270", name: "넷마블" }
      - { code: "259960", name: "크래프톤" }
      - { code: "263750", name: "펄어비스" }
      - { code: "078340", name: "컴투스" }
      - { code: "112040", name: "위메이드" }
      - { code: "293490", name: "카카오게임즈" }
    note: |
      ETF 규모가 작아(수백억) 자금흐름 축의 상장좌수 변화가 소수 좌수에도 크게
      흔들린다. 점수를 볼 때 구성종목 렌즈를 함께 본다.
      🔴 `036570` 의 원천 종목명이 `NC` 다 — 사명이 바뀌었다. 팀원이 화면에서
      "엔씨소프트"를 찾지 못할 수 있으니 UI 에서 이 이름을 그대로 쓴다.
      신작 출시가 개별 종목을 지배하는 테마라 섹터 점수와 종목이 자주 갈라진다.

  - id: media_entertainment
    name_ko: 미디어·엔터
    gics: "Communication Services"
    etfs:
      - { code: "228810", name: "TIGER 미디어컨텐츠" }
      - { code: "395290", name: "HANARO Fn K-POP&미디어" }
    members:
      - { code: "352820", name: "하이브" }
      - { code: "041510", name: "에스엠" }
      - { code: "035900", name: "JYP Ent." }
      - { code: "122870", name: "와이지엔터테인먼트" }
      - { code: "253450", name: "스튜디오드래곤" }
      - { code: "035760", name: "CJ ENM" }
    note: |
      K-POP 4사 + 드라마 제작 2사로 묶었다. 두 갈래는 사이클이 다르다 —
      앨범·공연(K-POP)과 편성·판권(드라마)이라 폭 축이 갈라지는 일이 잦다.
      ETF 는 둘을 섞어 담으므로 ETF 렌즈만 보면 어느 쪽이 움직였는지 알 수 없다.

  - id: telecom
    name_ko: 통신
    gics: "Communication Services"
    etfs:
      - { code: "315270", name: "TIGER 200커뮤니케이션서비스" }
    members:
      - { code: "017670", name: "SK텔레콤" }
      - { code: "030200", name: "KT" }
      - { code: "032640", name: "LG유플러스" }
    liquidity_warning: true
    note: |
      🔴 **순수 통신 ETF 가 국내에 없다.** 코스피200 커뮤니케이션서비스 하위지수라
      NAVER·카카오·게임이 함께 섞인다 — ETF 렌즈가 통신 3사를 대표하지 못한다.
      게다가 거래대금이 유동성 게이트(일 1억) 아래다. **실제 매수는 구성종목으로
      해야 하고**, 이 섹터는 ETF 렌즈보다 구성종목 렌즈를 믿는다.
      대안이 없어 섹터를 지우지 않았다 — 통신은 방어적 로테이션의 목적지라
      "비어 있음"보다 "믿을 수 없음"을 보여주는 편이 낫다.

  - id: battery
    name_ko: 2차전지
    gics: "Industrials"
    etfs:
      - { code: "305720", name: "KODEX 2차전지산업" }
      - { code: "364980", name: "TIGER 2차전지TOP10" }
    members:
      - { code: "373220", name: "LG에너지솔루션" }
      - { code: "006400", name: "삼성SDI" }
      - { code: "096770", name: "SK이노베이션" }
      - { code: "247540", name: "에코프로비엠" }
      - { code: "086520", name: "에코프로" }
      - { code: "003670", name: "포스코퓨처엠" }
      - { code: "066970", name: "엘앤에프" }
    note: |
      🔴 GICS 가 한 테마 안에서 갈린다 — LG에너지솔루션은 **Industrials**(전기장비),
      삼성SDI 는 **Information Technology**(전자부품), SK이노베이션은 **Energy**(정유).
      셋을 한 대분류로 밀어 넣을 수 없어 셀 3사의 무게중심인 Industrials 로 태그했다.
      대분류 롤업을 볼 때 이 섹터가 산업재를 부풀린다는 것을 알고 봐야 한다.
      구성종목은 셀 3사 + 양극재·음극재 4사다. 소재사가 셀보다 변동이 크다.

  - id: shipbuilding
    name_ko: 조선
    gics: "Industrials"
    etfs:
      - { code: "466920", name: "SOL 조선TOP3플러스" }
      - { code: "0115D0", name: "KODEX 조선TOP10" }
    members:
      - { code: "009540", name: "HD한국조선해양" }
      - { code: "329180", name: "HD현대중공업" }
      - { code: "010140", name: "삼성중공업" }
      - { code: "042660", name: "한화오션" }
      - { code: "097230", name: "HJ중공업" }
    note: |
      빅3(HD현대·삼성중공업·한화오션) 지배력이 커서 TOP3 압축 ETF 와 TOP10 ETF 를
      같이 둔다 — 갈라지면 "빅3만 오르는가 / 중소형 조선까지 오르는가"의 답이다.
      🔒 `HD현대미포` 를 넣지 않았다. 2026-09-10 유니버스에 없다(합병·재상장으로
      추정). **없는 코드는 적지 않는다** — 확인되면 그때 넣는다.
      한화오션은 `defense`(방산)에도 있다. 특수선 때문이고, 중복은 의도한 것이다.

  - id: defense
    name_ko: 방산
    gics: "Industrials"
    etfs:
      - { code: "449450", name: "PLUS K방산" }
      - { code: "0080G0", name: "KODEX 방산TOP10" }
    members:
      - { code: "012450", name: "한화에어로스페이스" }
      - { code: "047810", name: "한국항공우주" }
      - { code: "079550", name: "LIG디펜스앤에어로스페이스" }
      - { code: "064350", name: "현대로템" }
      - { code: "272210", name: "한화시스템" }
      - { code: "042660", name: "한화오션" }
    note: |
      수출 계약이 주가를 지배하는 테마다. 공시·뉴스는 점수에 넣지 않으므로
      (부호가 섞인 지표는 축이 될 수 없다) 계약 소식은 M12 타임라인에서 맥락으로만 본다.
      🔴 `079550` 의 원천 종목명이 `LIG디펜스앤에어로스페이스` 다 — 사명이 바뀌었다.
      `aerospace`(우주항공)와 한국항공우주를, `shipbuilding` 과 한화오션을 공유한다.
      의도한 중복이고, 두 섹터가 같이 오를 때 그 이유가 겹치는 종목에 있을 수 있다.

  - id: robot
    name_ko: 로봇
    gics: "Industrials"
    etfs:
      - { code: "445290", name: "KODEX 로봇액티브" }
      - { code: "0148J0", name: "TIGER 코리아휴머노이드로봇산업" }
    members:
      - { code: "454910", name: "두산로보틱스" }
      - { code: "277810", name: "레인보우로보틱스" }
      - { code: "108490", name: "로보티즈" }
      - { code: "388720", name: "유일로보틱스" }
      - { code: "090360", name: "로보스타" }
      - { code: "056080", name: "유진로봇" }
    note: |
      기대가 실적보다 앞서는 테마다. 밸류 축(15점)이 구조적으로 불리하게 나오므로
      모멘텀만 보고 1위가 되는 일이 잦다 — 축 분해를 반드시 함께 본다.
      휴머노이드 ETF 는 상장이 최근이라 20영업일 이력이 없는 구간이 있다.
      🔒 이력이 짧으면 자금흐름·모멘텀을 계산하지 않고 "—" 로 둔다. 0 이 아니다.

  - id: aerospace
    name_ko: 우주항공
    gics: "Industrials"
    etfs:
      - { code: "421320", name: "PLUS 우주항공" }
      - { code: "0207G0", name: "SOL 우주항공밸류체인" }
    members:
      - { code: "047810", name: "한국항공우주" }
      - { code: "099320", name: "쎄트렉아이" }
      - { code: "211270", name: "AP위성" }
      - { code: "451760", name: "컨텍" }
      - { code: "274090", name: "켄코아에어로스페이스" }
    note: |
      `defense` 와 겹친다 — 국내 우주항공은 방산 기업의 사업부인 경우가 많고
      대표 ETF 도 `TIGER K방산&우주` 처럼 둘을 한 바구니에 담는다. 그래서 방산과
      섞이지 않은 ETF 둘(`PLUS 우주항공` · `SOL 우주항공밸류체인`)만 골랐다.
      시가총액이 작은 종목이 다수라 폭 축이 소수 종목에 흔들린다.


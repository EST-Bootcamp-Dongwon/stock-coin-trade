      가깝지만, 대분류 롤업의 일관성을 위해 GICS 를 따랐다. 이 줄이 그 판단이다.
      브랜드사(아모레·LG생건)와 ODM(코스맥스·한국콜마)의 사이클이 다르다 —
      ODM 이 인디 브랜드 수출에 먼저 반응한다.


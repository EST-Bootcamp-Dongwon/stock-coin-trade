      한 섹터에 있고 사이클이 서로 다르다. 임상 결과 하나가 개별 종목을 지배하므로
      섹터 점수와 종목이 가장 자주 갈라지는 곳이다 — 폭 축을 특히 주의해 본다.
      액티브 ETF(KoAct)는 운용자 재량으로 구성이 바뀐다. 상장좌수 변화가
      자금 유입이 아니라 운용 판단일 수 있어, 자금흐름 축을 단독으로 믿지 않는다.


      키움증권은 이 대회의 주최사다. 실적 기대를 섹터 신호로 오독하지 않도록 적어 둔다.

  - id: nuclear
    name_ko: 원자력
    gics: "Utilities"
    etfs:
      - { code: "0091P0", name: "TIGER 코리아원자력" }
      - { code: "434730", name: "HANARO 원자력iSelect" }
    members:
      - { code: "034020", name: "두산에너빌리티" }
      - { code: "015760", name: "한국전력" }
      - { code: "052690", name: "한전기술" }
      - { code: "051600", name: "한전KPS" }
      - { code: "083650", name: "비에이치아이" }
      - { code: "105840", name: "우진" }
    note: |
      🔴 GICS 가 갈린다 — 두산에너빌리티는 **Industrials**(기계), 한국전력은
      **Utilities**(전력). 기자재(비에이치아이·우진)까지 넣으면 산업재 쪽이 더 무겁지만,
      섹터의 정체성이 전력 정책이라 Utilities 로 태그했다. 이 줄이 그 판단이다.
      SMR·원전 수출 정책에 반응하는 테마라 뉴스가 앞서고 실적이 뒤따른다 —
      모멘텀 축이 먼저 오르고 밸류 축이 내려간다.
      🔒 `AI 전력` ETF(전력기기·변압기)를 넣지 않았다. 같이 움직이지만 수요 동인이
      데이터센터라 원자력과 다르다. 섞으면 왜 올랐는지 말할 수 없게 된다.

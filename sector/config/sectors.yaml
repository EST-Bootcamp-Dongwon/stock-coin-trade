      (PBR 이 낮다) — 밸류가 높다는 것이 "싸다"는 뜻이지 "오른다"는 뜻이 아님을
      화면에서 함께 말한다.
      🔒 채권형 ETF 를 넣지 않았다. 이름에 "금융채·은행채"가 들어가지만 금리 상품이고,
      주식 섹터 점수와 섞으면 4축이 전부 무의미해진다.


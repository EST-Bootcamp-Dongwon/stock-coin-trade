      폭 축이 낮게 나오는 것이 정상이다. `KODEX 건설`(KRX 건설)과
      `TIGER 200 건설`(코스피200 하위)은 담는 종목 수가 달라 함께 둔다.
      🔴 `294870` 의 원천 종목명이 `IPARK현대산업개발` 다 — 사명이 바뀌었다.
      원자력·전력 설비 수주가 건설사로 잡히는 경우가 있어 `nuclear` 와 함께 움직일 수 있다.


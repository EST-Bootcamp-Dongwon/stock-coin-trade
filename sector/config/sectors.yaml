      상장좌수가 한 번 움직이면 점수가 크게 튄다. 순위 상단에 오르면 근거 화면에서
      좌수 변화를 직접 확인한다.
      항공(여객)·해운(운임)·육상물류가 한 섹터에 섞여 있다. 유가·운임지수에
      반대로 반응하는 종목들이라 폭 축이 낮게 나오는 것이 정상이다.


    note: |
      🔴 **순수 화학 ETF 가 국내에 없다.** 둘 다 "에너지화학"이라 정유가 섞여 있고,
      그래서 GICS Energy 대분류를 따로 세우지 않았다(`gics_sectors` 의 `empty_reason`).
      정유(S-Oil)와 화학(LG화학·롯데케미칼)은 정제마진과 스프레드로 서로 반대로

      🔴 ETF 둘 다 거래대금이 유동성 게이트(일 1억) 아래다. **ETF 렌즈를 믿을 수
      없는 섹터**이고, 실제 매수는 구성종목으로 해야 한다.
      국내 e커머스 1·2위(쿠팡·네이버쇼핑)가 이 섹터의 상장 종목이 아니다 —

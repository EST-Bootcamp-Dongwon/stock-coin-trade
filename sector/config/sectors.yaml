      경고 배지가 뜨도록 검증기가 잡는다 — 그때 `liquidity_warning` 을 켠다.
      POSCO홀딩스는 2차전지 소재(포스코퓨처엠)의 지주라 `battery` 와 같이 움직인다.
      풍산은 비철·방산 탄약이라 `defense` 와도 엮인다 — 철강 수요만 보면 오독한다.

